name: Feature request
description: Propose an evidence-backed improvement to the engine or its adapters.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the repeated workflow friction or missing capability.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the behavior you would like and where it belongs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any existing command, adapter, or workaround you tried.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Design boundaries
      options:
        - label: This preserves local-first evidence handling and explicit human review.
          required: true
        - label: This can remain provider-neutral, or the provider-specific behavior is isolated to an adapter.
          required: true
