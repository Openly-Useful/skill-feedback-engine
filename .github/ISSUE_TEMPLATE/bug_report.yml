name: Bug report
description: Report a reproducible problem in Skill Feedback Engine.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include the smallest safe command sequence or fixture that demonstrates the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the release or commit, Python version, operating system, and installation method.
      placeholder: |
        Skill Feedback Engine: v0.1.0
        Python: 3.12
        OS: macOS 15
        Install: pip editable checkout
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Observations and evidence may contain private work context.
      options:
        - label: I removed secrets, personal information, raw conversation history, and other private evidence.
          required: true
